<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영단어 학습</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef3f9;--ink:#0f1b33;--blue:#1558d6;--red:#d9263a;--ok:#1f9d55;--line:#c9d6ea}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow-x:hidden}
#app{height:100%}
body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:12px;padding:.8rem 1.3rem;border:2px solid var(--blue)}
.b{background:var(--blue);color:#fff}.b2{background:#fff;color:var(--blue)}
.b:focus-visible,.b2:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hid{display:none}.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.no{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
.ctr{min-height:100%;display:grid;place-content:center;gap:1rem;text-align:center;padding:1.5rem}
.ctr input{font:inherit;padding:.8rem;border:2px solid var(--line);border-radius:10px;width:min(320px,80vw)}
.hm{max-width:720px;margin:0 auto;padding:1rem}
.hm header{display:flex;justify-content:space-between;align-items:center}
.dy{background:#fff;border-radius:16px;margin:.8rem 0;padding:.8rem;border:1px solid var(--line)}
.dh{display:flex;gap:.6rem}.dt{flex:1;text-align:left;background:#fff;color:var(--ink);border-color:var(--line);font-weight:700;font-size:1.15rem}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.5rem;margin-top:.7rem}
.wc{background:#f7faff;color:var(--ink);border-color:var(--line);text-align:left;padding:.5rem .7rem}
.wc b{color:var(--blue);display:block}.wc small{opacity:.75}
.st{--pr:clamp(44px,5.5vw,70px);position:relative;display:grid;grid-template-columns:1fr 1fr;height:100%;min-height:100%}
.txt{--f:20px;padding:clamp(10px,2.2vh,28px) clamp(10px,2vw,28px) 22px calc(clamp(54px,6.5vw,84px) + env(safe-area-inset-left,0px));display:flex;flex-direction:column;overflow:hidden;min-height:0}
.bw{perspective:900px;cursor:pointer;color:var(--blue);font-weight:800;font-size:calc(var(--f)*2.1);line-height:1.15;word-break:break-word;margin-bottom:.35em;user-select:none;-webkit-tap-highlight-color:transparent}
.bw .in{display:grid;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1)}
.bw .in>*{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bw .bk{transform:rotateX(180deg);color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.bw .in.flip{transform:rotateX(180deg)}
.df{font-size:var(--f);line-height:1.5;min-height:0}
.df p{margin:0 0 .55em}
.rw{color:var(--red);font-weight:700;border-bottom:2px dotted var(--red);cursor:pointer}
.lock .rw{pointer-events:none}
.side{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:clamp(44px,5.5vw,70px);height:clamp(84px,24vh,150px);padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:clamp(11px,1.6vw,15px);font-weight:700;box-shadow:0 2px 10px rgba(15,27,51,.18)}
.side span{font-size:clamp(26px,4.5vw,44px);line-height:1}
#pv{left:env(safe-area-inset-left,0px);border-radius:0 16px 16px 0;border-left:0}#nx{right:env(safe-area-inset-right,0px);border-radius:16px 0 0 16px;border-right:0}
.cnt{position:absolute;left:clamp(54px,6.5vw,84px);bottom:4px;font-size:12px;opacity:.6;z-index:4}
.hb{position:absolute;top:6px;right:clamp(8px,1vw,14px);z-index:6;padding:.25rem .6rem;font-size:12px;border-width:1px;opacity:.85}
.pic{background:#dfe8f5;position:relative;overflow:hidden;min-height:0}.pic img{position:absolute;left:0;top:0;width:calc(100% - var(--pr));height:100%;object-fit:contain;object-position:center}
.pop{position:fixed;inset:0;background:rgba(15,27,51,.6);display:grid;place-items:center;z-index:9}
.pop .card{background:#fff;border-radius:16px;padding:.8rem;width:min(80vw,380px);text-align:center}
.pop img{width:100%;border-radius:10px;cursor:pointer}
.fm{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}.fm input{font:inherit;padding:.7rem;border:2px solid var(--line);border-radius:10px;flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:.7rem}td,th{padding:.55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr[data-i]{cursor:pointer}td button{padding:.35rem .7rem;font-size:.9rem}
html[data-m=port] .st{grid-template-columns:1fr;grid-template-rows:38% 1fr}html[data-m=port] .st{--pr:0px}html[data-m=port] .pic{order:-1}
/* ---- 퀴즈: 가로 화면 기준 (왼쪽 문제 / 오른쪽 보기 / 아래 다음 버튼) ---- */
.bl{color:var(--blue);letter-spacing:.05em}
.qz{--qf:clamp(14px,calc(var(--vh,1vh)*4.2),32px);--qb:clamp(14px,calc(var(--vh,1vh)*4.6),26px);height:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(6px,1.6vh,14px);padding:clamp(8px,2vh,18px) clamp(14px,3vw,40px);padding-left:calc(clamp(14px,3vw,40px) + env(safe-area-inset-left,0px));padding-right:calc(clamp(14px,3vw,40px) + env(safe-area-inset-right,0px))}
.qhd{display:flex;align-items:center;gap:.8rem;font-size:var(--qb)}.bar{flex:1;height:8px;border-radius:9px;background:#d5e0f1;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.qmain{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,28px);min-height:0}
.qq{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;min-height:0;overflow:auto}
.qlab{color:var(--blue);font-weight:800;font-size:var(--qb);margin-bottom:.5em}
.qq p{font-size:var(--qf);line-height:1.5;margin:0 0 .5em}.qq .big{font-size:calc(var(--qf)*1.7);font-weight:800;color:var(--ink);line-height:1.3}
.spk{font-size:var(--qb);padding:.7rem 1.3rem}
.op{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:clamp(6px,1.6vh,14px);min-height:0}
.op button,.mc button{font-size:var(--qb);padding:.25rem .6rem;min-height:0;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.mwrap{grid-column:1/-1;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,24px);min-height:0}.mc{display:grid;grid-auto-rows:minmax(0,1fr);gap:clamp(6px,1.6vh,14px);min-height:0}
.qft{display:flex;justify-content:flex-end;align-items:center;gap:1rem;min-height:clamp(38px,10vh,54px)}.fb{font-size:var(--qb);flex:1;text-align:left}.qft .b{font-size:var(--qb);padding:.4rem 1.6rem}
html[data-m=port] .qmain{grid-template-columns:1fr}html[data-m=port] .op button{padding:.5rem}html[data-m=port] .txt{padding-left:54px}
</style></head><body><div id="app"></div>
<script src="config.js"></script>
<script>
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),pad=n=>String(n).padStart(4,'0');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fn=w=>w.word.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim();
const img=w=>`img/${pad(w.no)}.jpg`,aud=(w,k)=>encodeURI(`audio/${pad(w.no)} ${fn(w)}_${k}.mp3`);
const hide="this.style.visibility='hidden'";
let W=[],vmap,RX,S,Z,cid,tok=0,ME,D;const track=()=>sb.from('progress').upsert({user_id:ME.id,day:S.d,pos:S.pos+1,updated_at:new Date().toISOString()}).then(()=>{});const A=new Audio();
function say(u,done){const t=++tok;A.pause();let i=0;const nx=()=>{if(t!=tok)return;if(i>=u.length){done&&done();return}A.src=u[i++];A.onended=nx;A.onerror=nx;A.play().catch(nx)};nx()}
const go=h=>{tok++;A.pause();$('#app').innerHTML=h;fit()};
const dw=d=>W.filter(w=>Math.ceil(w.no/30)==d);
// 단어 변형형태(복수, -ed, -ing, -er, -ly 등)
function vr(w){w=w.toLowerCase();const s=new Set([w]);if(w.includes(' '))return[...s];const b=w.slice(0,-1),l=w.slice(-1);
['s','es','ed','d','ing','er','ers','ly'].forEach(x=>s.add(w+x));
if(w.endsWith('e')){s.add(b+'ing');s.add(b+'er')}
if(/[^aeiou]y$/.test(w)){['ies','ied','ily','ier'].forEach(x=>s.add(b+x))}
s.add(w+l+'ed');s.add(w+l+'ing');s.add(w+l+'er');return[...s]}
function build(){vmap=new Map();W.forEach(w=>vmap.has(w.word.toLowerCase())||vmap.set(w.word.toLowerCase(),w.no));
W.forEach(w=>vr(w.word).forEach(v=>vmap.has(v)||vmap.set(v,w.no)));
const ks=[...vmap.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
RX=new RegExp('\\b('+ks.join('|')+')\\b','gi')}
const red=(t,w)=>{const s=new Set(vr(w.word));return esc(t).replace(RX,m=>{const k=m.toLowerCase();if(s.has(k))return m;const n=vmap.get(k);return n==null?m:`<span class=rw data-n="${n}">${m}</span>`})};
const blank=(t,w)=>esc(t).replace(new RegExp('\\b('+vr(w.word).sort((a,b)=>b.length-a.length).join('|')+')\\b','gi'),'<b class=bl>_____</b>');

// ---------- 로그인
function login(msg=''){leaveLearn();go(`<div class=ctr><h1>영단어 학습</h1><input id=em placeholder="아이디" autocomplete=username autocapitalize=none><input id=pw type=password placeholder="비밀번호" autocomplete=current-password><button id=li class=b>로그인</button><div style="color:var(--red)">${msg}</div></div>`);
$('#li').onclick=async()=>{if(SB_URL.includes('YOUR-')||SB_KEY.includes('YOUR-'))return login('index.html에 Supabase 주소와 키를 아직 넣지 않았습니다.');const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim().toLowerCase()+'@student.local',password:$('#pw').value});error?login('로그인 실패: '+error.message):enter()}}
async function enter(){const{data,error}=await sb.from('words').select('no,word,meaning,definition,example').order('no').limit(2000);
if(error||!data?.length)return login('단어를 불러오지 못했습니다. '+(error?.message||''));W=data;build();const{data:{user}}=await sb.auth.getUser();const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).single();ME={id:user.id,...p};ME.is_admin?admin():home()}

// ---------- 목록
function home(){leaveLearn();const n=Math.ceil(W.length/30);
go(`<div class=hm><header><h1>영단어</h1><span>${ME.is_admin?'<button id=ab class=b2>관리자</button> ':''}<button id=lo class=b2>로그아웃</button></span></header>${[...Array(n)].map((_,i)=>`<section class=dy><div class=dh><button class=dt data-d=${i+1}>${i+1}일차</button><button class=b data-s=${i+1}>학습시작</button></div><div class="wl hid" id=d${i+1}>${dw(i+1).map(w=>`<button class=wc data-w=${w.no}><b>${w.word}</b><small>${w.meaning}</small></button>`).join('')}</div></section>`).join('')}</div>`);
$('#lo').onclick=async()=>{await sb.auth.signOut();login()};if(ME.is_admin)$('#ab').onclick=admin;
$('.hm').onclick=e=>{const t=e.target.closest('button');if(!t)return;
if(t.dataset.d)$('#d'+t.dataset.d).classList.toggle('hid');
else if(t.dataset.s){enterLearn();start(+t.dataset.s)}
else if(t.dataset.w){const w=W.find(x=>x.no==t.dataset.w);enterLearn();start(Math.ceil(w.no/30),w.no)}}}

// ---------- 관리자
async function admin(){leaveLearn();const[a,b,c]=await Promise.all([sb.from('profiles').select('*').eq('is_admin',false),sb.from('progress').select('*'),sb.from('quiz_results').select('*').order('created_at',{ascending:false})]);
D=(a.data||[]).map(p=>{const g=(b.data||[]).find(x=>x.user_id==p.id),qs=(c.data||[]).filter(x=>x.user_id==p.id);return{...p,g,qs,t:[g&&g.updated_at,qs[0]&&qs[0].created_at].filter(Boolean).sort().pop()}});
go(`<div class=hm style="max-width:900px"><header><h1>관리자</h1><span><button id=sv class=b2>학습 화면</button> <button id=lo class=b2>로그아웃</button></span></header>
<section class=dy><b>학생 계정 만들기</b><div class=fm><input id=nu placeholder="아이디(영문·숫자)" autocapitalize=none><input id=nn placeholder="이름"><input id=np placeholder="비밀번호(6자 이상)"><button id=nc class=b>만들기</button></div><div id=msg style="margin-top:.5rem"></div></section>
<section class=dy><div class=dh><b style="flex:1;align-self:center">학생 현황</b><button id=s1 class=b>최신순</button><button id=s2 class=b2>이름순</button></div><div class=tw><table><thead><tr><th>학생<th>진행<th>마지막 학습<th>최근 퀴즈<th></thead><tbody id=tb></tbody></table></div></section></div>`);
$('#lo').onclick=async()=>{await sb.auth.signOut();login()};$('#sv').onclick=home;$('#s1').onclick=()=>view('t');$('#s2').onclick=()=>view('n');
$('#nc').onclick=async()=>{const u=$('#nu').value.trim().toLowerCase(),n=$('#nn').value.trim(),pw=$('#np').value;
if(!/^[a-z0-9_]{3,20}$/.test(u)||!n||pw.length<6)return $('#msg').textContent='아이디(영문·숫자 3자 이상), 이름, 비밀번호(6자 이상)를 확인해 주세요.';
const{error}=await sb.rpc('admin_create_student',{p_username:u,p_password:pw,p_name:n});error?$('#msg').textContent='실패: '+error.message:admin()};
$('#tb').onclick=async e=>{const i=e.target.closest('[data-i]')?.dataset.i;if(i==null)return;const s=D[i],a=e.target.dataset.a;
if(a=='pw'){const pw=prompt(s.name+' 새 비밀번호(6자 이상)');if(pw&&pw.length>=6){const{error}=await sb.rpc('admin_reset_password',{p_username:s.username,p_password:pw});alert(error?error.message:'변경했습니다.')}}
else if(a=='del'){if(confirm(s.name+' 학생과 학습 기록을 모두 삭제할까요?')){await sb.rpc('admin_delete_student',{p_username:s.username});admin()}}
else $('#h'+i).classList.toggle('hid')};
view('t')}
function view(m){D.sort(m=='n'?(a,b)=>a.name.localeCompare(b.name,'ko'):(a,b)=>(b.t||'').localeCompare(a.t||''));
const f=t=>t?new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
$('#s1').className=m=='n'?'b2':'b';$('#s2').className=m=='n'?'b':'b2';
$('#tb').innerHTML=D.map((s,i)=>{const q=s.qs[0];return`<tr data-i=${i}><td><b>${esc(s.name)}</b><br><small>${s.username}</small><td>${s.g?`${s.g.day}일차 · ${s.g.pos}/30`:'-'}<td>${f(s.t)}<td>${q?`${q.day}일차 <b>${q.score}</b>/10`:'-'}<td><button class=b2 data-a=pw data-i=${i}>비번</button> <button class=b2 data-a=del data-i=${i}>삭제</button><tr class=hid id=h${i}><td colspan=5>${s.qs.map(x=>`${f(x.created_at)} · ${x.day}일차 ${x.score}/10`).join('<br>')||'퀴즈 기록 없음'}`}).join('')||'<tr><td colspan=5>위에서 학생 계정을 먼저 만들어 주세요.'}

// ---------- 학습
function start(d,no){const list=dw(d);S={d,list,pos:Math.max(0,list.findIndex(w=>w.no==no)),hist:[]};show(list[S.pos])}
function show(w){cid=w.no;track();
go(`<div class=st><button id=hb class="hb b2">목록</button><div class=txt><div id=bw class=bw><div class=in id=bin><div class=fr>${w.word}</div><div class=bk id=bk>${esc(w.meaning)}</div></div></div><div id=df class=df><p>${red(w.definition,w)}</p><p>${red(w.example,w)}</p></div></div><div class=pic><img src="${img(w)}" onerror="${hide}"></div><button id=pv class="side b2"><span>‹</span>이전</button><button id=nx class="side b"><span>›</span>다음</button><div class=cnt>${S.pos+1} / ${S.list.length}</div></div>`);
fit();
const df=$('#df');df.classList.add('lock');say([aud(w,'word'),aud(w,'defex')],()=>df.classList.remove('lock'));
let ko=false,tm=0;const bin=$('#bin');
$('#bw').onclick=()=>{const busy=df.classList.contains('lock');clearTimeout(tm);ko=!ko;bin.classList.toggle('flip',ko);if(ko)tm=setTimeout(()=>{ko=false;bin.classList.remove('flip')},2000);if(!busy)say([aud(w,'word')])};
df.onclick=e=>{const r=e.target.closest('.rw');if(r)return pop(+r.dataset.n);if(df.classList.contains('lock'))return;df.classList.add('lock');say([aud(w,'defex')],()=>df.classList.remove('lock'))};
$('#hb').onclick=home;
$('#pv').onclick=()=>{const h=S.hist.pop();if(!h)return home();S.pos=h.pos;show(W.find(x=>x.no==h.id))};
$('#nx').onclick=()=>{S.hist.push({id:cid,pos:S.pos});S.pos++;S.pos>=S.list.length?done():show(S.list[S.pos])}}
// ---------- 가로 고정 / 글자 크기 자동 맞춤 ----------
const touch=matchMedia('(pointer:coarse)').matches;let learn=false;
function fit(){const w=innerWidth,h=innerHeight,a=$('#app'),R=document.documentElement,rot=learn&&touch&&h>w;
if(rot){a.style.cssText=`position:fixed;left:0;top:0;width:${h}px;height:${w}px;transform-origin:0 0;transform:translateX(${w}px) rotate(90deg);overflow:auto`}else a.style.cssText='';
const W_=rot?h:w,H_=rot?w:h;R.dataset.m=W_/H_>1.3?'land':'port';R.style.setProperty('--vh',H_/100+'px');
cancelAnimationFrame(fit.r);fit.r=requestAnimationFrame(autofit)}
function autofit(){const t=$('.txt'),bw=$('#bw'),df=$('#df');if(!t||!bw||!df)return;
const cs=getComputedStyle(t),avail=t.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-2;
const ok=f=>{t.style.setProperty('--f',f+'px');kfit();return bw.offsetHeight+parseFloat(getComputedStyle(bw).marginBottom)+df.scrollHeight<=avail};
let lo=11,hi=80,best=11;while(hi-lo>.5){const m=(lo+hi)/2;if(ok(m)){best=m;lo=m}else hi=m}
t.style.setProperty('--f',best+'px');kfit()}
function kfit(){const fr=$('#bin .fr'),bk=$('#bk');if(!fr||!bk)return;bk.style.fontSize='';
const one=parseFloat(getComputedStyle(fr).lineHeight)||fr.offsetHeight;let sc=1;
while(bk.offsetHeight>one*2.1&&sc>.5){sc-=.1;bk.style.fontSize=sc+'em'}}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
document.fonts&&document.fonts.ready.then(()=>{if($('.txt'))autofit()});
// 학습 모드: 학습시작/단어 선택 때만 전체화면 + 가로 고정 (목록·로그인·관리자 화면에서는 해제)
function enterLearn(){learn=true;if(!touch)return;const e=document.documentElement;
(e.requestFullscreen?e.requestFullscreen({navigationUI:'hide'}):Promise.reject()).then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{}).finally(()=>setTimeout(fit,300))}
function leaveLearn(){if(!learn)return;learn=false;try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}setTimeout(fit,300)}
function pop(n){const w=W.find(x=>x.no==n),p=document.createElement('div');p.className='pop';
p.innerHTML=`<div class=card><img src="${img(w)}" onerror="${hide}"><h2 style="color:var(--blue);margin:.5rem 0">${w.word}</h2><small>그림을 누르면 학습화면으로 이동</small></div>`;
p.onclick=e=>{if(e.target.tagName=='IMG'){p.remove();S.hist.push({id:cid,pos:S.pos});show(w)}else if(e.target==p)p.remove()};$('#app').appendChild(p)}
function done(){go(`<div class=ctr><h1>오늘 학습 완료!</h1><button id=qg class=b>퀴즈 풀러 가기</button><button id=qs class=b2>그만하기</button></div>`);$('#qg').onclick=quiz;$('#qs').onclick=home}

// ---------- 퀴즈 (10문제: 영영풀이 빈칸 / 단어-뜻 짝짓기 / 듣고 뜻 고르기 / 뜻 보고 영단어 고르기) ----------
const QT=['cloze','match','listen','mean'];
function quiz(){Z={i:0,sc:0,wrong:[],qs:sh(S.list).slice(0,10).map(w=>({w,t:QT[Math.random()*QT.length|0]}))};q()}
const hdr=()=>`<div class=qhd><div class=bar><i style="width:${Z.i/Z.qs.length*100}%"></i></div><span><b>${Z.i+1}</b> / ${Z.qs.length}</span></div>`;
const ftr='<div class=qft><span id=fb class=fb></span><button id=qn class=b style="visibility:hidden">다음</button></div>';
function nxBtn(msg){$('#fb').innerHTML=msg||'';const b=$('#qn');b.style.visibility='visible';b.onclick=()=>{Z.i++;q()}}
function q(){if(Z.i>=Z.qs.length)return fin();const{w,t}=Z.qs[Z.i],others=sh(S.list.filter(x=>x.word!=w.word)).slice(0,3),four=sh([w,...others]);
if(t=='match')return match(w,[w,...others]);
let lab,left,opts;
if(t=='cloze'){lab='빈칸에 들어갈 단어는?';left=`<p>${blank(w.definition,w)}</p><p>${blank(w.example,w)}</p>`;opts=four.map(x=>[x.no,x.word])}
else if(t=='listen'){lab='소리를 듣고 알맞은 뜻을 고르세요';left='<button id=spk class="b spk">🔊 다시 듣기</button>';opts=four.map(x=>[x.no,x.meaning])}
else{lab='이 뜻에 맞는 영단어는?';left=`<p class=big>${esc(w.meaning)}</p>`;opts=four.map(x=>[x.no,x.word])}
go(`<div class=qz>${hdr()}<div class=qmain><div class=qq><small class=qlab>${lab}</small>${left}</div><div class=op>${opts.map(o=>`<button class=b2 data-n=${o[0]}>${esc(o[1])}</button>`).join('')}</div></div>${ftr}</div>`);
if(t=='listen'){const play=()=>say([aud(w,'word')]);$('#spk').onclick=play;play()}
let done=0;document.querySelectorAll('.op button').forEach(b=>b.onclick=()=>{const x=W.find(v=>v.no==b.dataset.n),first=!done;
if(first){done=1;const ok=x.no==w.no;if(ok)Z.sc++;else Z.wrong.push(w.word);b.classList.add(ok?'ok':'no');if(!ok)document.querySelector(`.op [data-n="${w.no}"]`).classList.add('ok');nxBtn(`<b>${w.word}</b> &nbsp;${esc(w.meaning)}`)}
say([aud(t=='listen'&&first?w:x,'word')])})}
function match(w,g){go(`<div class=qz>${hdr()}<div class=qmain><div class=mwrap><small class=qlab>단어와 뜻을 짝지어 보세요</small><div class=mt><div class=mc>${sh(g).map(x=>`<button class=b2 data-l=${x.no}>${x.word}</button>`).join('')}</div><div class=mc>${sh(g).map(x=>`<button class=b2 data-r=${x.no}>${esc(x.meaning)}</button>`).join('')}</div></div></div></div>${ftr}</div>`);
let sel=null,err=0,m=0;
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;say([aud(W.find(x=>x.no==b.dataset.l),'word')]);document.querySelectorAll('[data-l]').forEach(x=>x.style.outline='');sel=b;b.style.outline='3px solid var(--ink)'});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(!sel||b.classList.contains('ok'))return;
if(sel.dataset.l==b.dataset.r){sel.classList.add('ok');b.classList.add('ok');sel.style.outline='';sel=null;if(++m==4){if(!err)Z.sc++;else Z.wrong.push(w.word);nxBtn(err?'다 맞췄어요! (틀린 횟수 '+err+')':'한 번에 다 맞췄어요!')}}
else{err++;b.classList.add('no');setTimeout(()=>b.classList.remove('no'),500)}})}
async function fin(){const wr=[...new Set(Z.wrong)];go(`<div class=ctr><h1>${Z.sc} / ${Z.qs.length}</h1><p>${S.d}일차 퀴즈 결과</p>${wr.length?`<p style="max-width:80%">다시 볼 단어: <b>${wr.join(', ')}</b></p>`:'<p>모두 맞췄어요! 🎉</p>'}<div style="display:flex;gap:.8rem;justify-content:center"><button id=ag class=b>다시 풀기</button><button id=hm class=b2>목록으로</button></div></div>`);
$('#ag').onclick=quiz;$('#hm').onclick=home;try{await sb.from('quiz_results').insert({day:S.d,score:Z.sc})}catch(e){}}

sb.auth.getSession().then(({data})=>data.session?enter():login());
</script></body></html>
